[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiii"
version = "0.1.0.dev0"
description = "The overfitting linter for trading backtests — the Thirteenth Man Protocol, automated."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "GaryCL971" }]
keywords = ["backtesting", "overfitting", "quant", "trading", "validation", "audit"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["xiii*"]
